<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MoGe-web</title>
  <base target="_blank">
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@~0.185/build/three.webgpu.js",
      "three/webgpu": "https://unpkg.com/three@~0.185/build/three.webgpu.js",
      "three/addons/": "https://unpkg.com/three@~0.185/examples/jsm/",
      "three/tsl": "https://unpkg.com/three@~0.185/build/three.tsl.js",
      "onnxruntime-web": "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.27.0/dist/ort.all.min.mjs"
    }
  }
  </script>
  <script type="module">
    import * as ort from 'onnxruntime-web'
    import { normal_tensor_to_canvas } from './normal_tensor_to_canvas.js'

    // ===
    // MoGe2 - Runtime was designed to be replaceable, but now favors simplicity with onnxruntime
    // ===

    class ORTMoge2 {
      constructor({ inference_session, model_precision }) {
        this.inference_session = inference_session
        this.model_precision = model_precision
        this.normal_tensor_to_canvas_backend = '' // derived during infer_normal
      }
      static async create({ model_url, model_precision }) {
        return new ORTMoge2({
          inference_session: await ort.InferenceSession.create(model_url, {
            executionProviders: ['webgpu'],
            graphOptimizationLevel: 'all'
          }),
          model_precision
        })
      }
      async infer_normal({ canvas, res=9 }) {
        const image_tensor = new ort.Tensor(
          this.model_precision,
          CanvasUtil.to_float_NCHW({ canvas, precision: this.model_precision }),
          [1, 3, canvas.height, canvas.width]
        )

        const num_tokens = (1200 + res / 9 * (3600 - 1200)) | 0  // [0,9] -> [1200,3600]
        const num_tokens_tensor = new ort.Tensor('int64', new BigInt64Array([BigInt(num_tokens)]), [])

        performance.mark('moge_infer')
        const result = await this.inference_session.run({ image: image_tensor, num_tokens: num_tokens_tensor })
        performance.measure('moge_infer', 'moge_infer')

        performance.mark('normal_tensor_to_canvas')
        const { backend, normal_canvas } = await normal_tensor_to_canvas({ tensor: result.normal })
        performance.measure('normal_tensor_to_canvas', 'normal_tensor_to_canvas')
        this.normal_tensor_to_canvas_backend = backend

        result.mask?.dispose()
        result.normal?.dispose()
        result.points?.dispose()
        result.scale?.dispose() // Ruicheng/moge-2-vits-normal-onnx
        result.metric_scale?.dispose()
        image_tensor.dispose()
        num_tokens_tensor.dispose()

        return normal_canvas
      }
    }

    // ===
    // Utilities
    // ===

    class CanvasUtil {
      static to_float_NCHW({ canvas, precision='float16' }) {
        const [sw, sh] = [canvas.width, canvas.height]
        const src = canvas.getContext('2d').getImageData(0, 0, sw, sh).data
        const n_pixels = sw * sh
        const dst = new (precision === 'float16' ? Float16Array : Float32Array)(3 * n_pixels)
        const g0 = n_pixels
        const b0 = n_pixels * 2
        for (let i = 0, j = 0; i < 4 * n_pixels; i += 4, j += 1) {
          dst[j] = src[i] / 255
          dst[g0 + j] = src[i + 1] / 255 // g
          dst[b0 + j] = src[i + 2] / 255 // b
        }
        return dst 
      }
      static from_image({ img, size=null }) {
        const [sw, sh] = [img.width, img.height]
        const [dw, dh] = size ?? [img.width, img.height]
        const canvas = document.createElement('canvas')
        canvas.width = dw
        canvas.height = dh
        canvas.getContext('2d').drawImage(img, 0, 0, sw, sh, 0, 0, dw, dh)
        return canvas
      }
    }

    class FuncUtil {
      static debounce({ fn, ms }) {
        let timer
        return function (...args) {
          clearTimeout(timer)
          timer = setTimeout(fn.bind(this, ...args), ms)
        }
      }
    }

    class MathUtil {
      static scale_to_max_dim({ size, max_dim }) {
        const s = max_dim / Math.max(...size)
        return [size[0] * s | 0, size[1] * s | 0]
      }
    }
    
    // ===
    // Previewer
    // ===

    import * as THREE from 'three/webgpu'
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js'
    import { DragControls } from 'three/addons/controls/DragControls.js'

    class Previewer {
      constructor({ renderer, container_el }) {
        const scene = new THREE.Scene()
        const camera = new THREE.PerspectiveCamera(15)
        const controls = new OrbitControls(camera, renderer.domElement)
        const drag_controls = new DragControls([], camera, renderer.domElement)
        
        renderer.toneMapping = THREE.AgXToneMapping
        renderer.toneMappingExposure = 0.3
        camera.position.set(0, 0, 4)
        controls.saveState()
        controls.enableRotate = false
        drag_controls.recursive = false
        delete drag_controls.mouseButtons.RIGHT

        this.render = () => renderer.render(scene, camera)

        scene.add(new THREE.AmbientLight('white', Math.PI))
        const light0 = new THREE.PointLight('white', Math.PI * 0.7, 0, 2)
        const light0_gizmo = new THREE.Mesh(
          new THREE.BoxGeometry(9e9, 9e9, 0.1),
          new THREE.MeshBasicMaterial({ transparent: true, opacity: 0 })
        )
        light0_gizmo.add(light0)
        scene.add(light0_gizmo)
        drag_controls.objects.push(light0_gizmo)

        const LIGHT0_Z = 0.1
        const cross_mesh = new THREE.GridHelper(9e9, 2, 'black')
        cross_mesh.geometry.rotateX(-Math.PI / 2).translate(0, 0, LIGHT0_Z * -0.99)
        light0_gizmo.add(cross_mesh)

        const mat = new THREE.MeshPhysicalMaterial({ transparent: true, roughness: 0, metalness: 0 })
        const mesh = new THREE.Mesh(new THREE.PlaneGeometry(), mat)
        scene.add(mesh)
        
        drag_controls.addEventListener('dragstart', () => {
          cross_mesh.visible = false
          this.render()
        })
        drag_controls.addEventListener('dragend', () => {
          cross_mesh.visible = true
          this.render()
        })
        drag_controls.addEventListener('drag', () => this.render())
        controls.addEventListener('change', () => this.render())

        new ResizeObserver( ([e]) => {
          const w = Math.max(1, e.contentBoxSize[0].inlineSize) 
          const h = Math.max(1, e.contentBoxSize[0].blockSize)
          renderer.setPixelRatio(devicePixelRatio)
          renderer.setSize(w, h, false)
          camera.aspect = w / h
          camera.updateProjectionMatrix()
          renderer.render(scene, camera)
        }).observe(container_el)
        container_el.append(renderer.domElement)

        this.mat = mat
        this.mesh = mesh
        this.controls = controls
        this.light0_gizmo = light0_gizmo
        this.LIGHT0_Z = LIGHT0_Z
        this.max_tdim = renderer.backend.device.limits.maxTextureDimension2D
      }
      static async create({ container_el }) {
        return new Previewer({
          container_el,
          renderer: await new THREE.WebGPURenderer().init()
        })
      }
      preview({ input_canvas, normal_canvas }) {
        this.mat.map?.dispose()
        this.mat.map = this.create_canvas_texture({ canvas: input_canvas })
        this.mat.map.colorSpace = THREE.SRGBColorSpace
        this.mat.normalMap?.dispose()
        this.mat.normalMap = this.create_canvas_texture({ canvas: normal_canvas })
        this.mat.needsUpdate = true
        this.mesh.scale.set(input_canvas.width / input_canvas.height, 1, 1)
        this.render()
      }
      create_canvas_texture({ canvas }) {
        const size = [canvas.width, canvas.height]
        const safe_canvas = Math.max(...size) > this.max_tdim
          ? CanvasUtil.from_image({
              img: canvas,
              size: MathUtil.scale_to_max_dim({ size, max_dim: this.max_tdim })
            })
          : canvas
        return new THREE.CanvasTexture(safe_canvas)
      }
      reset_controls() {
        this.controls.reset()
        this.light0_gizmo.position.set(0, 0, this.LIGHT0_Z)
        this.render()
      }
    }
    
    // ===
    // App
    // ===

    new class App {
      #state = 'setup' // 'setup' | 'idle' | 'inference'
      #moge = null
      #previewer = null
      #input_canvas = null // cache
      #res = 9 // in range [0,9]
      #max_dim = 518 // in range [1,SAFE_MAX_DIM]
      #working_size = [0, 0] // derive from input_canvas dim and max_dim
      static SAFE_MAX_DIM = 1036
      constructor() {
        this.register_events()
        el_res.value = this.#res
        el_max_dim.value = this.#max_dim
        el_max_dim.max = App.SAFE_MAX_DIM
      }
      set_results({ input_canvas, normal_canvas }) {
        el_input_image_container.querySelector('canvas')?.remove()
        el_input_image_container.append(input_canvas)
        el_normal_image_container.querySelector('canvas')?.remove()
        el_normal_image_container.append(normal_canvas)
      }
      set_state(state) {
        document.body.dataset.state = state
        this.#state = state

        if (state === 'setup') {
          el_input.disabled = true
          el_res.disabled = true
          el_max_dim.disabled = true
        } else if (state === 'idle') {
          el_input.disabled = false
          el_res.disabled = !this.#input_canvas
          el_max_dim.disabled = !this.#input_canvas
        } else if (state === 'inference') {
          el_input.disabled = true
          el_res.disabled = true
          el_max_dim.disabled = true
        }
      }
      set_status(status) {
        el_status.textContent = status
      }
      async infer_normal() {
        if (this.#state !== 'idle') return

        this.set_state('inference')

        performance.mark('app_infer')

        const input_canvas = this.#input_canvas
        const res = this.#res
        const max_dim = this.#max_dim

        const input_size = [input_canvas.width, input_canvas.height]
        const working_size = MathUtil.scale_to_max_dim({ size: input_size, max_dim })
        this.#working_size = working_size

        // ===
        // input_canvas -> working_input_canvas -> working_normal_canvas -> normal_canvas
        // ===

        const working_input_canvas = CanvasUtil.from_image({ img: input_canvas, size: working_size })

        this.set_status('Running inference ...')
        let working_normal_canvas // OffscreenCanvas
        try {
          working_normal_canvas = await this.#moge.infer_normal({ canvas: working_input_canvas, res })
        } catch (err) {
          console.error(err)
          this.set_status(err.message)
          this.set_state('idle')
          performance.clearMarks()
          performance.clearMeasures()
          return
        }

        const normal_canvas = CanvasUtil.from_image({ img: working_normal_canvas, size: input_size })

        this.set_results({ input_canvas, normal_canvas })

        this.#previewer.preview({ input_canvas, normal_canvas })
        this.set_state('idle')

        performance.measure('app_infer', 'app_infer')

        const dur_dump = performance.getEntriesByName('normal_tensor_to_canvas', 'measure')[0].duration
        const dur_app = performance.getEntriesByName('app_infer', 'measure')[0].duration
        const dur_moge = performance.getEntriesByName('moge_infer', 'measure')[0].duration
        const f = (dur) => (dur / 1000).toFixed(3) + 's'
        const backend = this.#moge.normal_tensor_to_canvas_backend
        const [sw, sh] = working_size
        const [dw, dh] = input_size

        this.set_status(`[${sw}x${sh}->${dw}x${dh}] Done in ${f(dur_app)} (moge ${f(dur_moge)}, bilateral_${backend} ${f(dur_dump)})`)

        performance.clearMarks()
        performance.clearMeasures()
      }
      register_events() {
        el_model_container.addEventListener('submit', this.on_submit.bind(this))
        el_input.addEventListener('input', this.on_input.bind(this))
        el_res.addEventListener('change', this.on_res_change.bind(this))
        el_max_dim.addEventListener('change', FuncUtil.debounce({
          fn: this.on_max_dim_change.bind(this),
          ms: 100
        }))

        document.addEventListener('paste', this.on_paste.bind(this))

        window.addEventListener('dragenter', e => { e.preventDefault(); e.stopPropagation() })
        window.addEventListener('dragover', e => { e.preventDefault(); e.stopPropagation() })
        window.addEventListener('dragleave', e => { e.preventDefault(); e.stopPropagation() })
        window.addEventListener('drop', e => { e.preventDefault(); e.stopPropagation() })
        window.addEventListener('drop', this.on_drop.bind(this))
      }
      async on_submit(e) {
        e.preventDefault()
        e.target.hidden = true
        this.set_status("Loading model ...")
        const { url, precision } = Array.from(e.target.elements['model']).find(r => r.checked).dataset

        try {
          performance.mark('load_model')
          this.#moge = await ORTMoge2.create({ model_url: url, model_precision: precision })
          performance.measure('load_model', 'load_model')
        } catch (err) {
          console.error(err)
          this.set_status(err.message)
          e.target.hidden = false // let user retry
          this.set_state('setup')
          performance.clearMarks()
          performance.clearMeasures()
        }

        const dur = performance.getEntriesByName('load_model', 'measure')[0].duration
        const f = dur => (dur / 1000).toFixed(2) + 's'
        this.set_status(`Model loaded in ${f(dur)}`)

        this.#previewer = await Previewer.create({ container_el: el_preview_container })
        this.set_state('idle')
        performance.clearMarks()
        performance.clearMeasures()
      }
      async on_input(e) {
        const file = e.target.files[0] // Assume image files
        if (!file) return

        const input_bitmap = await createImageBitmap(file)
        const input_canvas = CanvasUtil.from_image({ img: input_bitmap })
        input_bitmap.close()
        this.#input_canvas = input_canvas

        await this.infer_normal()

        this.#previewer.reset_controls()

        el_input_image_container.hidden = false
        el_normal_image_container.hidden = false
        el_preview_container.hidden = false
      }
      async on_drop(e) {
        if (this.#state !== 'idle') return

        const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'))
        await this.on_input({ target: { files } }) // fake event
      }
      async on_paste(e) {
        if (this.#state !== 'idle') return

        const items = e.clipboardData?.items 
        if (!items) return

        const files = Array.from(items).filter(i => i.type.startsWith('image/')).map(i => i.getAsFile())
        await this.on_input({ target: { files } }) // fake event
      }
      async on_res_change(e) {
        this.#res = Number.parseInt(e.target.value, 10)
        await this.infer_normal()
      }
      async on_max_dim_change(e) {
        const value = Number.parseInt(e.target.value, 10) || 1  // NaN -> 1
        const clamped = Math.max(1, Math.min(App.SAFE_MAX_DIM, value))
        this.#max_dim = e.target.value = clamped
        await this.infer_normal()
      }
    }
  </script>
</head>
<body data-state="setup">
  <nav>
    <a href="https://github.com/ycw/MoGe-web">MoGe-web</a>
    <a href="https://x.com/ycwhk">@ycwhk</a>
    <mark id="el_status"></mark>
  </nav>
  <form id="el_model_container">
    <ul>
      <li>
        <label>
          <input type="radio" name="model" data-url="./moge-2-vits-normal-fp16.onnx" data-precision="float16" checked>
          <span>73 MB</span>
          <span>float16</span>
          <span>github: ycw/MoGe-web/moge-2-vits-normal-fp16.onnx</span>
        </label>
      </li>
      <li>
        <label>
          <input type="radio" name="model" data-url="https://huggingface.co/Ruicheng/moge-2-vits-normal-onnx/resolve/main/model.onnx" data-precision="float32">
          <span>141 MB</span>
          <span>float32</span>
          <span>huggingface: Ruicheng/moge-2-vits-normal-onnx</span>
        </label>
      </li>
      <li>
        <label>
          <input type="radio" name="model" data-url="https://huggingface.co/Ruicheng/moge-2-vitb-normal-onnx/resolve/main/model.onnx" data-precision="float32">
          <span>419 MB</span>
          <span>float32</span>
          <span>huggingface: Ruicheng/moge-2-vitb-normal-onnx</span>
        </label>
      </li>
      <li>
        <label>
          <input type="radio" name="model" data-url="https://huggingface.co/Ruicheng/moge-2-vitl-normal-onnx/resolve/main/model.onnx" data-precision="float32">
          <span>1.32 GB</span>
          <span>float32</span>
          <span>huggingface: Ruicheng/moge-2-vitl-normal-onnx</span>
        </label>
      </li>
    </ul>
    <button type="submit" id="el_model_submit">load model</button>
  </form>
  <main>
    <div id="el_controls">
      <label title="Select image, or drop image, or paste image">
        <input type="file" id="el_input" accept="image/*">
      </label>
      <label title="[0,9] Higher the res, higher the detail">
        Res
        <select id="el_res" disabled>
          <option>0</option>
          <option>1</option>
          <option>2</option>
          <option>3</option>
          <option>4</option>
          <option>5</option>
          <option>6</option>
          <option>7</option>
          <option>8</option>
          <option>9</option>
        </select>
      </label>
      <label title="[1,1036] Resize input image for inference">
        MaxDim
        <input type="number" id="el_max_dim" min="1" disabled>
      </label>
    </div>
    <div id="el_input_image_container" class="output_container" hidden>
      <div class="info">
        <span class="label">IMAGE</span>
      </div>
    </div>
    <div id="el_normal_image_container" class="output_container" hidden>
      <div class="info">
        <span class="label">NORMAL</span>
      </div>
    </div>
    <div id="el_preview_container" class="output_container" hidden>
      <div class="info">
        <span class="label">LIVE PREVIEW</span>
      </div>
    </div>
  </main>
  <style>
    html, body { margin: 0; padding: 0; height: 100vh }
    [hidden] { display: none !important }
    label:has([disabled]) { opacity: 0.5 }
    select, input, option { border: none; border-bottom: 1px solid #0003 }
    body {
      font: 1em monospace;
      padding: 1em; box-sizing: border-box;
      &[data-state=setup] main { display: none }
      &:not([data-state=setup]) {
        & #el_model_container { display: none }
        display: grid; gap: 1em;
        grid-template-rows: auto minmax(0,1fr);
      }
    }
    nav { display: flex; gap: 2ch }
    main {
      display: grid; gap: 1em;
      grid-template:
        'controls controls' auto
        'preview input_image_container' minmax(0,1fr)
        'preview normal_image_container' minmax(0,1fr)
      / minmax(60vw,1fr) auto;
    }    
    #el_controls { grid-area: controls }
    #el_input_image_container { grid-area: input_image_container }
    #el_normal_image_container { grid-area: normal_image_container }
    #el_preview_container { grid-area: preview }

    #el_model_container {
      margin: 1em;
      & #el_model_url { width: 40vw }
      & ul {
        list-style-type: none; padding: unset;
        & li label {
          display: grid; grid-template-columns: auto 8ch 8ch 1fr; gap: 1ch;
          & > *:nth-child(2) { place-self: end }
        }
      }
    }
    #el_controls {
      display: flex; gap: 0.5em; align-items: baseline;
      border-radius: 0.5em; overflow: hidden;
      outline: thin solid currentcolor;
      & label { padding: 0.5em; box-sizing: border-box }
    }
    .output_container {
      position: relative;
      border-radius: 0.5em; overflow: hidden;
      outline: thin solid currentcolor;
      & .info {
        position: absolute; z-index: 1;
        & .label { padding: 0 1ch; background: black; color: white }
        & .content { padding: 0 1ch; background: white; color: black }
      }
      & canvas { width: 100%; height: 100%; object-fit: contain }
      &#el_preview_container canvas { object-fit: unset }
    }
  </style>
</body>
</html>
