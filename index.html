<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MoGe-web</title>
  <base target="_blank">
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@~0.185/build/three.webgpu.js",
      "three/webgpu": "https://unpkg.com/three@~0.185/build/three.webgpu.js",
      "three/addons/": "https://unpkg.com/three@~0.185/examples/jsm/",
      "three/tsl": "https://unpkg.com/three@~0.185/build/three.tsl.js",
      "onnxruntime-web": "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.27.0/dist/ort.all.min.mjs"
    }
  }
  </script>
  <script type="module">
    import * as ort from 'onnxruntime-web'
    import { normal_tensor_to_canvas } from './normal_tensor_to_canvas.js'

    // ===
    // Onnxruntime Utilities
    // ===

    class ORTInferenceSession {
      #session
      constructor({ session }) {
        this.#session = session
      }
      static async create({ model_url, option }) {
        return new ORTInferenceSession({
          session: await ort.InferenceSession.create(model_url, option)
        })
      }
      async run({ option }) {
        return await this.#session.run(option)
      }
    }

    class ORTTensor {
      static Buffer = {
        'float16': Float16Array,
        'float32': Float32Array,
        'int64': BigInt64Array,
      }
      static create({ dtype, buffer, dims }) {
        if (dtype === 'float16') return new ort.Tensor('float16', buffer, dims)
        if (dtype === 'float32') return new ort.Tensor('float32', buffer, dims)
        if (dtype === 'int64') return new ort.Tensor('int64', buffer, dims)
      }
      // NHWC imageData(u8, 4ch, 0..255) -> NCHW tensor(f16|f32, 3ch, 0..1)
      static from_canvas({ canvas, dtype }) {
        const sw = canvas.width
        const sh = canvas.height
        const src = canvas.getContext('2d').getImageData(0, 0, sw, sh).data
        const n_pixels = sw * sh
        const buffer = new ORTTensor.Buffer[dtype](3 * n_pixels)
        const g_start_at = n_pixels
        const b_start_at = n_pixels * 2
        for (let i = 0, j = 0; i < 4 * n_pixels; i += 4, j += 1) {
          buffer[j] = src[i] / 255 // r
          buffer[g_start_at + j] = src[i + 1] / 255 // g
          buffer[b_start_at + j] = src[i + 2] / 255 // b
        }
        return ORTTensor.create({ dtype, buffer, dims: [1, 3, sh, sw] })
      }
      static async to_canvas(opt) {
        return await normal_tensor_to_canvas(opt)
      }
    }

    // ===
    // MoGe2
    // ===

    class MoGe2 {
      #session
      #dtype
      constructor({ session, dtype }) {
        this.#session = session
        this.#dtype = dtype
      }
      static async create({ model_url, dtype }) {
        return new MoGe2({
          dtype,
          session: await ORTInferenceSession.create({
            model_url, 
            option: {
              executionProviders: ['webgpu'],
              graphOptimizationLevel: 'all'
            }
          })
        })
      }
      async infer_normal({ canvas, res=9 }) {
        const image_tensor = await ORTTensor.from_canvas({ canvas, dtype: this.#dtype })
        const num_tokens = (1200 + res / 9 * (3600 - 1200)) | 0  // [0,9] -> [1200,3600]
        const num_tokens_tensor = ORTTensor.create({ 
          dtype: 'int64', 
          buffer: new ORTTensor.Buffer['int64']([BigInt(num_tokens)]),
          dims: []
        })

        performance.mark('moge_infer')
        const result = await this.#session.run({
          option: {
            image: image_tensor,
            num_tokens: num_tokens_tensor
          }
        })
        performance.measure('moge_infer', 'moge_infer')
        
        const normal_canvas = await ORTTensor.to_canvas({
          tensor: result.normal,
          smoothing_threshold_deg: 8,
          kernel_radius: 7
        })

        result.mask.dispose()
        result.normal.dispose()
        result.points.dispose()
        result.scale?.dispose() // Ruicheng/moge-2-vits-normal-onnx outputs `scale` instead of `metric_scale`
        result.metric_scale?.dispose()
        image_tensor.dispose()
        num_tokens_tensor.dispose()
  
        return normal_canvas
      }
    }

    // ===
    // HTML Utilities
    // ===

    class HTMLUtil {
      // Draw any image source to a new canvas
      static image_to_canvas({ img, dw, dh }) {
        const sw = img.width
        const sh = img.height
        const canvas = document.createElement('canvas')
        canvas.width = dw
        canvas.height = dh
        const ctx = canvas.getContext('2d', { willReadFrequently: true, desynchronized: false })
        ctx.drawImage(img, 0, 0, sw, sh, 0, 0, dw, dh)
        return canvas
      }
      // ===
      // Deprecated:
      //  `offscreencanvas.convertToBlob()` is VERY SLOW for hires(8k+)
      //  Use <canvas> instead, <canvas> lacks "open image in new tab" BTW.
      // ===
      // static async canvas_to_image({ canvas }) {
      //   const blob = await canvas.convertToBlob() // slow for hires
      //   const img = new Image()
      //   img.src = URL.createObjectURL(blob)
      //   return img
      // }
    }

    // ===
    // JS Utilities
    // ===

    class FuncUtil {
      static debounce({ fn, ms }) {
        let timer
        return function (...args) {
          clearTimeout(timer)
          timer = setTimeout(fn.bind(this, ...args), ms)
        }
      }
    }
    
    // ===
    // Previewer
    // ===

    import * as THREE from 'three/webgpu'
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js'
    import { DragControls } from 'three/addons/controls/DragControls.js'

    class Previewer {
      constructor({ renderer, container_el }) {
        const scene = new THREE.Scene()
        const camera = new THREE.PerspectiveCamera(15)
        const controls = new OrbitControls(camera, renderer.domElement)
        const drag_controls = new DragControls([], camera, renderer.domElement)
        
        camera.position.set(0, 0, 5)
        controls.enableRotate = false
        controls.saveState()

        const ambient_light = new THREE.AmbientLight('white', Math.PI / 4)
        scene.add(ambient_light)

        this.render = () => renderer.render(scene, camera)

        const light0 = new THREE.PointLight('white', Math.PI * 3 / 4, 0, 2)
        const light0_gizmo = new THREE.Mesh(
          new THREE.SphereGeometry(0.05),
          new THREE.MeshBasicMaterial({ color: 'yellow', transparent: true })
        )
        light0_gizmo.add(light0)
        light0_gizmo.position.set(0, 0, 0.1)
        scene.add(light0_gizmo)
        drag_controls.objects.push(light0_gizmo)

        const mat = new THREE.MeshLambertMaterial({ transparent: true })
        const mesh = new THREE.Mesh(new THREE.PlaneGeometry(), mat)
        scene.add(mesh)
        
        drag_controls.addEventListener('dragstart', () => {
          light0_gizmo.material.opacity = 0
          this.render()
        })
        drag_controls.addEventListener('dragend', () => {
          light0_gizmo.material.opacity = 1
          this.render()
        })
        drag_controls.addEventListener('drag', () => this.render())
        controls.addEventListener('change', () => this.render())

        const on_resize = FuncUtil.debounce({
          fn: ([e]) => {
            const w = Math.max(1, e.contentBoxSize[0].inlineSize) 
            const h = Math.max(1, e.contentBoxSize[0].blockSize)
            renderer.setPixelRatio(devicePixelRatio)
            renderer.setSize(w, h, false)
            camera.aspect = w / h
            camera.updateProjectionMatrix()
            renderer.render(scene, camera)
          },
          ms: 1
        })
        new ResizeObserver(on_resize).observe(container_el)
        container_el.append(renderer.domElement)

        this.mat = mat
        this.mesh = mesh
        this.controls = controls
        this.light0_gizmo = light0_gizmo
        this.max_tdim = renderer.backend.device.limits.maxTextureDimension2D
      }
      static async create({ container_el }) {
        return new Previewer({
          container_el,
          renderer: await new THREE.WebGPURenderer().init()
        })
      }
      preview({ input_canvas, normal_canvas }) {
        this.mat.map?.dispose()
        this.mat.map = this.create_canvas_texture({ canvas: input_canvas })
        this.mat.map.colorSpace = THREE.SRGBColorSpace
        this.mat.normalMap?.dispose()
        this.mat.normalMap = this.create_canvas_texture({ canvas: normal_canvas })
        this.mat.needsUpdate = true
        this.mesh.scale.set(input_canvas.width / input_canvas.height, 1, 1)
        this.render()
      }
      create_canvas_texture({ canvas }) {
        // resize to fit max texture dimension 2d, avoid crash for hires input
        const s = this.max_tdim / Math.max(canvas.width, canvas.height)
        const dw = canvas.width * s
        const dh = canvas.height * s
        return new THREE.CanvasTexture(
          Math.max(canvas.width, canvas.height) > this.max_tdim
            ? HTMLUtil.image_to_canvas({ img: canvas, dw, dh })
            : canvas
        )
      }
      reset_controls() {
        this.controls.reset()
        this.light0_gizmo.position.set(0, 0, 0.01)
        this.render()
      }
    }
    
    // ===
    // App
    // ===

    new class App {
      #state = 'setup' // 'setup' | 'idle' | 'inference'
      #moge = null
      #previewer = null
      #input_canvas = null // cache
      #res = 9 // in range [0,9]
      #max_dim = 518 // in range [1,SAFE_MAX_DIM]
      #working_dim2d = [0, 0] // derive from input_canvas dim and max_dim
      static SAFE_MAX_DIM = 1036
      constructor() {
        this.register_events()
        el_res.value = this.#res
        el_max_dim.value = this.#max_dim
        el_max_dim.max = App.SAFE_MAX_DIM
      }
      set_input_canvas({ canvas }) {
        this.#input_canvas = canvas
        this.enable_controls({ file_input: true, others: !!canvas })
      }
      enable_controls({ file_input, others }) {
        el_input.disabled = !file_input
        el_res.disabled = !others
        el_max_dim.disabled = !others
      }
      set_results({ input_canvas, normal_canvas }) {
        el_input_image_container.querySelector('canvas')?.remove()
        el_input_image_container.append(input_canvas)
        el_normal_image_container.querySelector('canvas')?.remove()
        el_normal_image_container.append(normal_canvas)
      }
      set_state(state) {
        document.body.dataset.state = state
        this.#state = state
      }
      set_status(status) {
        el_status.textContent = status
      }
      async infer_normal() {
        if (this.#state !== 'idle') return

        this.set_state('inference')
        this.enable_controls({ file_input: false, others: false })
        performance.mark('app_infer')

        const input_canvas = this.#input_canvas
        const res = this.#res
        const max_dim = this.#max_dim

        const scale = (max_dim > 0) ? max_dim / Math.max(input_canvas.width, input_canvas.height) : 1
        const working_dim2d = [
          Math.max(1, input_canvas.width * scale | 0),
          Math.max(1, input_canvas.height * scale | 0)
        ]
        this.#working_dim2d = working_dim2d

        // Resize input canvas, preserve aspect ratio
        const working_input_canvas = (max_dim > 0)
          ? HTMLUtil.image_to_canvas({
              img: input_canvas,
              dw: working_dim2d[0],
              dh: working_dim2d[1]
            })
          : input_canvas

        this.set_status('Running inference ...')
        let working_normal_canvas // OffscreenCanvas
        try {
          working_normal_canvas = await this.#moge.infer_normal({ canvas: working_input_canvas, res })
        } catch (err) {
          console.error(err)
          this.set_status(err.message)
          this.enable_controls({ file_input: true, others: true })
          this.set_state('idle')
          performance.clearMarks()
          performance.clearMeasures()
          return
        }

        // Resize working normal canvas to match the original input canvas.
        //  Blindly draw to a new <canvas> which can be appended to the DOM.
        const normal_canvas = HTMLUtil.image_to_canvas({
          img: working_normal_canvas,
          dw: input_canvas.width,
          dh: input_canvas.height
        })

        this.set_results({ input_canvas, normal_canvas })

        this.#previewer.preview({ input_canvas, normal_canvas })
        this.enable_controls({ file_input: true, others: true })
        this.set_state('idle')

        performance.measure('app_infer', 'app_infer')

        const entry_to_canvas_gpu = performance.getEntriesByName('to_canvas_gpu', 'measure') 
        const entry_to_canvas_cpu = performance.getEntriesByName('to_canvas_cpu', 'measure')
        const dur_bilateral = (entry_to_canvas_gpu[0] || entry_to_canvas_cpu[0]).duration
        const dur_app = performance.getEntriesByName('app_infer', 'measure')[0].duration
        const dur_moge = performance.getEntriesByName('moge_infer', 'measure')[0].duration
        const f = (dur) => (dur / 1000).toFixed(3) + 's'
        const backend = entry_to_canvas_gpu[0] ? 'gpu' : 'cpu'
        const [sw, sh] = this.#working_dim2d
        const [dw, dh] = [this.#input_canvas.width, this.#input_canvas.height]

        this.set_status(`[${sw}x${sh}->${dw}x${dh}] Done in ${f(dur_app)} (moge ${f(dur_moge)}, bilateral_${backend} ${f(dur_bilateral)})`)

        performance.clearMarks()
        performance.clearMeasures()
      }
      register_events() {
        el_model_container.addEventListener('submit', this.on_submit.bind(this))
        el_input.addEventListener('input', this.on_input.bind(this))
        el_res.addEventListener('change', this.on_res_change.bind(this))
        el_max_dim.addEventListener('change', FuncUtil.debounce({
          fn: this.on_max_dim_change.bind(this),
          ms: 100
        }))
        document.addEventListener('paste', this.on_paste.bind(this))

        window.addEventListener('dragenter', e => { e.preventDefault(); e.stopPropagation() })
        window.addEventListener('dragover', e => { e.preventDefault(); e.stopPropagation() })
        window.addEventListener('dragleave', e => { e.preventDefault(); e.stopPropagation() })
        window.addEventListener('drop', e => { e.preventDefault(); e.stopPropagation() })
        window.addEventListener('drop', this.on_drop.bind(this))
      }
      async on_submit(e) {
        e.preventDefault()
        e.target.hidden = true
        try {
          this.set_status("Loading model ...")
          const radio = Array.from(e.target.elements['model_url']).find(r => r.checked)

          const model_url = radio.dataset.url
          const dtype = radio.dataset.dtype
          const t0 = performance.now()
          this.#moge = await MoGe2.create({ model_url, dtype })
          const dur = ((performance.now() - t0) / 1000).toFixed(2) 
          this.set_status(`Model loaded in ${dur}s`)
          this.#previewer = await Previewer.create({ container_el: el_preview_container })
          this.set_state('idle')
        } catch (err) {
          console.error(err)
          this.set_status(err.message)
          e.target.hidden = false // let user retry
          this.set_state('setup')
        }
      }
      async on_input(e) {
        const file = e.target.files[0]
        if (!file) return

        const input_bitmap = await createImageBitmap(file)
        const input_canvas = HTMLUtil.image_to_canvas({
          img: input_bitmap,
          dw: input_bitmap.width,
          dh: input_bitmap.height
        })
        input_bitmap.close()

        this.set_input_canvas({ canvas: input_canvas })
        await this.infer_normal()
        this.#previewer.reset_controls()

        el_input_image_container.hidden = false
        el_normal_image_container.hidden = false
        el_preview_container.hidden = false
      }
      async on_res_change(e) {
        this.#res = Number.parseInt(e.target.value, 10)
        await this.infer_normal()
      }
      async on_max_dim_change(e) {
        this.#max_dim = e.target.value = Math.max(1, Math.min(App.SAFE_MAX_DIM,
          Number.parseInt(e.target.value, 10) || 1  // NaN -> 1
        ))
        await this.infer_normal()
      }
      async on_drop(e) {
        if (this.#state !== 'idle') return

        const files = e.dataTransfer.files

        let image_file = null
        for (const file of files) {
          if (file.type.startsWith('image/')) {
            image_file = file
            break
          }
        }
        if (image_file) {
          await this.on_input({ target: { files: [image_file] }}) // fake event
        }
      }
      async on_paste(e) {
        if (this.#state !== 'idle') return

        const items = e.clipboardData?.items
        if (!items) return

        let image_file = null
        for (const item of items) {
          if (item.type.startsWith('image/')) {
            image_file = item.getAsFile()
            break
          }
        }
        if (image_file) {
          await this.on_input({ target: { files: [image_file] }}) // fake event
        }
      }
    }
  </script>
</head>
<body data-state="setup">
  <nav>
    <a href="https://github.com/ycw/MoGe-web">MoGe-web</a>
    <a href="https://x.com/ycwhk">@ycwhk</a>
    <mark id="el_status"></mark>
  </nav>
  <form id="el_model_container">
    <ul>
      <li>
        <label>
          <input type="radio" name="model_url" data-url="./moge-2-vits-normal-fp16.onnx" data-dtype="float16" checked>
          <span>73 MB</span>
          <span>float16</span>
          <span>github: ycw/MoGe-web/moge-2-vits-normal-fp16.onnx</span>
        </label>
      </li>
      <li>
        <label>
          <input type="radio" name="model_url" data-url="https://huggingface.co/Ruicheng/moge-2-vits-normal-onnx/resolve/main/model.onnx" data-dtype="float32">
          <span>141 MB</span>
          <span>float32</span>
          <span>huggingface: Ruicheng/moge-2-vits-normal-onnx</span>
        </label>
      </li>
      <li>
        <label>
          <input type="radio" name="model_url" data-url="https://huggingface.co/Ruicheng/moge-2-vitb-normal-onnx/resolve/main/model.onnx" data-dtype="float32">
          <span>419 MB</span>
          <span>float32</span>
          <span>huggingface: Ruicheng/moge-2-vitb-normal-onnx</span>
        </label>
      </li>
      <li>
        <label>
          <input type="radio" name="model_url" data-url="https://huggingface.co/Ruicheng/moge-2-vitl-normal-onnx/resolve/main/model.onnx" data-dtype="float32">
          <span>1.32 GB</span>
          <span>float32</span>
          <span>huggingface: Ruicheng/moge-2-vitl-normal-onnx</span>
        </label>
      </li>
    </ul>
    <button type="submit" id="el_model_submit">load model</button>
  </form>
  <main>
    <div id="el_controls">
      <label title="Select image, or drop image, or paste image">
        <input type="file" id="el_input" accept="image/*">
      </label>
      <label title="[0,9] Higher the res, higher the detail">
        Res
        <select id="el_res" disabled>
          <option>0</option>
          <option>1</option>
          <option>2</option>
          <option>3</option>
          <option>4</option>
          <option>5</option>
          <option>6</option>
          <option>7</option>
          <option>8</option>
          <option>9</option>
        </select>
      </label>
      <label title="[1,1036] Resize input image for inference">
        MaxDim
        <input type="number" id="el_max_dim" min="1" disabled>
      </label>
    </div>
    <div id="el_input_image_container" class="output_container" hidden>
      <div class="info">
        <span class="label">IMAGE</span>
      </div>
    </div>
    <div id="el_normal_image_container" class="output_container" hidden>
      <div class="info">
        <span class="label">NORMAL</span>
      </div>
    </div>
    <div id="el_preview_container" class="output_container" hidden>
      <div class="info">
        <span class="label">LIVE PREVIEW</span>
      </div>
    </div>
  </main>
  <style>
    html, body { margin: 0; padding: 0; height: 100vh }
    pre { display: inline; margin: 0 }
    [hidden] { display: none !important }
    label:has([disabled]) { opacity: 0.5 }
    select, input, option { border: none; border-bottom: 1px solid #0003 }
    body {
      font: 1em monospace;
      padding: 1em; box-sizing: border-box;
      &[data-state=setup] { 
        & main { display: none }
      }
      &:not([data-state=setup]) {
        & #el_model_container { display: none }
        display: grid; gap: 1em;
        grid-template-rows: auto minmax(0,1fr);
      }
    }
    nav {
      display: flex; gap: 2ch;
    }
    main {
      display: grid; gap: 1em;
      grid-template:
        'controls controls' auto
        'preview input_image_container' minmax(0,1fr)
        'preview normal_image_container' minmax(0,1fr)
      / minmax(50vw,1fr) auto;
    }    
    #el_controls { grid-area: controls }
    #el_input_image_container { grid-area: input_image_container }
    #el_normal_image_container { grid-area: normal_image_container }
    #el_preview_container { grid-area: preview }

    #el_model_container {
      margin: 1em;
      & #el_model_url { width: 40vw }
      & ul {
        list-style-type: none; padding: unset;
        & li {
          & label {
            display: grid; grid-template-columns: auto 8ch 8ch 1fr; gap: 1ch;
            & > *:nth-child(2) { place-self: end }
          }
        }
      }
    }
    #el_controls {
      display: flex; gap: 0.5em; align-items: baseline;
      border-radius: 0.5em; overflow: hidden;
      outline: thin solid currentcolor;
      & label {
        max-height: 3em; box-sizing: border-box;
        padding: 0.5em;
      }
    }
    .output_container {
      position: relative;
      border-radius: 0.5em; overflow: hidden;
      outline: thin solid currentcolor;
      & .info {
        position: absolute; z-index: 1;
        display: grid; grid-template-columns: auto 1fr;
        & .label { padding: 0 1ch; background: black; color: white }
        & .content { padding: 0 1ch; background: white; color: black }
      }
      & canvas { width: 100%; height: 100%; object-fit: contain }
    }
    #el_preview_container {
      & canvas { object-fit: unset }
    }
  </style>
</body>
</html>
